name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check (Cypress)
        run: npx tsc --noEmit -p cypress/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Content/illustration audits
        run: npm run audit

      - name: Component tests (Jest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: E2E tests (Cypress)
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm start
          wait-on: "http://localhost:3000"
